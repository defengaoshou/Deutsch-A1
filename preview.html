<script>
"use strict";
const PROJECT="https://ogmluylcboqvuglvzyig.supabase.co";
const KEY="sb_publishable_6XHXbVHms6H7zUyKZmZrfA_lKo1doy8";
const ui=id=>document.getElementById(id);
let session=null, identity=null, grants=[], courseRows=[], admin=false;
const say=(s)=>{ui("portalMsg").textContent=s};
async function api(path,opts={}){
 const {method="GET",body,headers={},login=false}=opts;
 const res=await fetch(PROJECT+path,{method,headers:{apikey:KEY, ...(session&&!login?{Authorization:"Bearer "+session.access_token}:{}), ...(body!==undefined?{"Content-Type":"application/json"}:{}),...headers},...(body!==undefined?{body:JSON.stringify(body)}:{})});
 const raw=await res.text();let data=null;try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!res.ok)throw new Error(data?.message||data?.msg||data?.error_description||data?.error||"HTTP "+res.status);
 return data;
}
async function allRows(table,query){
 const result=[];for(let offset=0;;offset+=500){const batch=await api("/rest/v1/"+table+"?"+query+"&limit=500&offset="+offset);if(!Array.isArray(batch))throw Error("返回数据异常");result.push(...batch);if(batch.length<500)break}return result
}
function logout(){session=null;identity=null;location.reload()}
ui("portalLogout").onclick=logout;ui("returnPortal").onclick=logout;
ui("loginForm").onsubmit=async e=>{
 e.preventDefault();ui("loginSubmit").disabled=true;say("正在登录…");
 try{
  session=await api("/auth/v1/token?grant_type=password",{method:"POST",login:true,body:{email:ui("loginEmail").value.trim(),password:ui("loginPass").value}});
  ui("loginPass").value="";
  identity=session.user;
  if(!session.access_token||!identity?.id)throw Error("登录响应异常");
  const profile=await api("/rest/v1/profiles?select=user_id,active,display_name&user_id=eq."+encodeURIComponent(identity.id));
  if(!profile[0]?.active)throw Error("账号已停用或尚未建立");
  courseRows=await api("/rest/v1/courses?select=level,title,published&order=level.asc");
  try{admin=(await api("/rest/v1/rpc/wortstudio_my_is_admin",{method:"POST",body:{}}))===true}catch{admin=false}
  ui("loginAccount").textContent=identity.email+(admin?" · 教师管理员":" · 学生");
  ui("loginForm").hidden=true;ui("coursePortal").hidden=false;
  const levels=courseRows.filter(c=>admin||c.published);
  const box=ui("courseButtons");box.replaceChildren();
  for(const c of levels){const btn=document.createElement("button");btn.textContent=c.level+(c.published?"":" · 未发布");btn.className="primary";btn.onclick=()=>loadCourse(c.level,btn);box.append(btn)}
  say(levels.length?"请选择课程。":"暂未开通课程，请联系教师。");
  if(admin){ui("adminPortal").hidden=false;try{await initAdmin()}catch(err){ui("adminMsg").textContent="读取学生列表失败："+err.message}}
 }catch(err){session=null;identity=null;ui("loginForm").hidden=false;ui("coursePortal").hidden=true;ui("adminPortal").hidden=true;say("登录或读取权限失败："+err.message)}
 finally{ui("loginSubmit").disabled=false}
};
async function loadCourse(level,btn){
 btn.disabled=true;say("正在读取已授权词库…");
 try{
  const rows=await allRows("vocabulary","select=id,level,lesson_no,sort_order,word,word_form,meaning_zh,example_de,example_zh,visual&level=eq."+encodeURIComponent(level)+"&order=lesson_no.asc,sort_order.asc,id.asc");
  if(!rows.length){say("该课程暂无可访问词汇。");return}
  const progress=await allRows("learning_progress","select=vocabulary_id,mastered,wrong_count&user_id=eq."+encodeURIComponent(identity.id)+"&level=eq."+encodeURIComponent(level)+"&order=vocabulary_id.asc");
  ui("studyTitle").textContent=level+" · 单词学习室";ui("studySubtitle").textContent="DEUTSCH / "+level+" / WORTSTUDIO";ui("cardCount").textContent="共 "+rows.length+" 个单词卡";ui("levelBadge").textContent="教材等级："+level;
  ui("portal").hidden=true;ui("studyApp").hidden=false;
  startStudy(rows,level,progress);
 }catch(err){ui("studyApp").hidden=true;ui("portal").hidden=false;say("加载失败："+err.message)}finally{btn.disabled=false}
}
let adminStudents=[];
async function initAdmin(){
 adminStudents=await allRows("profiles","select=user_id,email,display_name,active&order=user_id.asc");
 const select=ui("studentSelect");select.replaceChildren();
 for(const p of adminStudents.filter(p=>p.user_id!==identity.id)){const opt=new Option((p.display_name?p.display_name+" · ":"")+(p.email||p.user_id),p.user_id);select.add(opt)}
 select.onchange=()=>loadEnrollments().catch(e=>ui("adminMsg").textContent=e.message);
 ui("saveEnroll").onclick=()=>saveEnrollments().catch(e=>ui("adminMsg").textContent=e.message);
 await loadEnrollments();
}
async function loadEnrollments(){
 const id=ui("studentSelect").value;const wrap=ui("enrollmentControls");wrap.replaceChildren();ui("saveEnroll").disabled=true;
 if(!id)return;
 grants=await api("/rest/v1/enrollments?select=level,active,valid_until&user_id=eq."+encodeURIComponent(id));
 if(ui("studentSelect").value!==id)return;
 for(const c of courseRows){const lab=document.createElement("label"), cb=document.createElement("input");cb.type="checkbox";cb.value=c.level;const existing=grants.find(x=>x.level===c.level);cb.checked=!!existing?.active;lab.append(cb,document.createTextNode(c.level+(c.published?"":"（未发布）")+(existing?.valid_until?" · 到期 "+existing.valid_until.slice(0,10):"")));wrap.append(lab)}
 ui("saveEnroll").disabled=false;
}
async function saveEnrollments(){
 const id=ui("studentSelect").value;if(!id)return;ui("saveEnroll").disabled=true;ui("studentSelect").disabled=true;
 try{

function normalize(s){ return (s||'').toLowerCase(); }

function applyFilters(keepCurrent=false){
  const lesson = el('lessonFilter').value;
  const q = normalize(el('search').value.trim());

  const prev = keepCurrent ? state.filtered[state.index] : null;
  state.filtered = words.filter(w => {
    if (lesson !== 'all' && w.lesson !== lesson) return false;
    if (q) {
      const text = [w.w,w.f,w.c,w.e,w.ec,w.lesson].join(' | ').toLowerCase();
      if (!text.includes(q)) return false;
    }
    const known = isKnown(w);
    if (mode === 'todo' && known) return false;
    if (mode === 'known' && !known) return false;
    return true;
  });
  if (prev) {
    const idx = state.filtered.findIndex(w => wordKey(w) === wordKey(prev));
    state.index = idx >= 0 ? idx : 0;
  } else if (state.index >= state.filtered.length) {
    state.index = 0;
  }
  renderList();
  renderCard();
  renderStats();
}

function chooseGermanVoice(voices){
  const normalize=v=>String(v.lang||'').trim().toLowerCase().replace(/_/g,'-');
  const de=voices.filter(v=>/^de(?:-|$)/.test(normalize(v)));
  return de.find(v=>normalize(v)==='de-de'&&v.localService)||de.find(v=>normalize(v)==='de-de')||de[0]||null;
}
function speak(text, rate=1, silent=false){
  if(!text)return;
  stopSpeech();
  const request=speechRequest;
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){
    voiceStatus('当前浏览器不支持语音朗读，请使用支持德语语音的 Chrome 或 Edge。');return;
  }
  const synth=window.speechSynthesis;
  function trySpeak(){
    if(request!==speechRequest)return true;
    const voice=chooseGermanVoice(synth.getVoices());
    if(!voice)return false;
    voiceStatus('');
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voice;
    u.lang=voice.lang.replace(/_/g,'-');
    u.rate=rate;
    u.onerror=e=>{if(request===speechRequest&&!['canceled','interrupted'].includes(e.error)){voiceStatus('德语语音播放失败，请确认系统已安装德语语音，或换用 Edge / Chrome。')}};
    synth.speak(u);
    return true;
  }
  if(trySpeak())return;
  voiceStatus('正在加载德语语音…');
  let done=false,timer;
  const cleanup=()=>{done=true;clearTimeout(timer);synth.removeEventListener('voiceschanged',changed)};
  function changed(){if(!done&&trySpeak())cleanup()}
  synth.addEventListener('voiceschanged',changed);
  timer=setTimeout(()=>{
    if(done)return;
    cleanup();
    if(request!==speechRequest)return;
    if(!trySpeak())voiceStatus('未检测到德语语音（Deutsch / de-DE）。请在系统中安装德语语音后刷新网页；已禁止使用英语代替。');
  },1600);
  changed();
}

function qgrade(answer,skip=false){if(quiz.answered||!quiz.active)return;const q=quiz.questions[quiz.i];if(!skip&&!qnorm(answer))return;quiz.answered=true;const ok=!skip&&qnorm(answer)===qnorm(q.answer);quiz.results.push({q,answer:skip?'（跳过）':answer,ok});if(ok)delete quizWrong[qid(q.w)];else quizWrong[qid(q.w)]=true;syncProgress(q.w,{wrong_count:ok?0:(remoteProgress.get(q.w.id)?.wrong_count||0)+1});for(const b of qel('quizOptions').children){b.disabled=true;if(b.textContent===q.answer)b.classList.add('qRight');else if(b.textContent===answer)b.classList.add('qWrong')}qel('quizAnswer').disabled=true;qel('quizSubmit').disabled=true;qel('quizSkip').hidden=true;qel('quizListen').hidden=false;qel('quizNext').hidden=false;qel('quizNext').textContent=quiz.i===quiz.questions.length-1?'查看成绩':'下一题 →';qel('quizFeedback').className='quizFeedback '+(ok?'good':'bad');qel('quizFeedback').textContent=(ok?'回答正确':skip?'已跳过':'回答错误')+'\n正确答案：'+q.answer+'\n'+q.w.w+' — '+q.w.c+(q.w.f?'\n'+q.w.f:'');qel('quizFeedback').hidden=false;qel('quizLiveScore').textContent=`答对 ${quiz.results.filter(x=>x.ok).length} 题`;qel('quizProgress').style.width=((quiz.i+1)/quiz.questions.length*100)+'%';qel('quizNext').focus();if(autoRead.quiz)speak(q.w.w,1,true)}
function qnext(){if(!quiz.answered)return;quiz.i++;qrender()}
function qfinish(){stopSpeech();quiz.active=false;qview('finished');const n=quiz.results.length,correct=quiz.results.filter(x=>x.ok).length,wrong=quiz.results.filter(x=>!x.ok);if(n)writeQueue=writeQueue.then(()=>api("/rest/v1/test_results",{method:"POST",headers:{Prefer:"return=minimal"},body:{user_id:identity.id,level,total_questions:n,correct_count:correct}})).catch(e=>alert("成绩保存失败："+e.message));qel('quizPercent').textContent=(n?Math.round(correct/n*100):0)+'% 正确率';qel('quizTotal').textContent=n;qel('quizCorrect').textContent=correct;qel('quizIncorrect').textContent=wrong.length;qel('quizRetry').disabled=!wrong.length;qel('quizMistakes').replaceChildren();if(!wrong.length)qel('quizMistakes').textContent='本轮没有错题。';for(const r of wrong){const d=document.createElement('div');d.className='quizMistake';const a=document.createElement('strong');a.textContent=r.q.w.w+' — '+r.q.w.c;const b=document.createElement('div');b.className='muted';b.textContent=r.q.w.lesson+' · 你的答案：'+r.answer+'；正确答案：'+r.q.answer;const e=document.createElement('div');e.textContent=r.q.w.e||'';const c=document.createElement('div');c.className='muted';c.textContent=r.q.w.ec||'';d.append(a,b,e,c);qel('quizMistakes').append(d)}}
qel('quizLesson').innerHTML=qel('lessonFilter').innerHTML;for(const id of ['quizLesson','quizScope','quizType','quizCount'])qel(id).onchange=qavailable;
qel('quizHeader').onclick=qel('quizOpen').onclick=qopen;qel('quizClose').onclick=qclose;qel('quizDialog').addEventListener('cancel',e=>{e.preventDefault();qclose()});qel('quizStart').onclick=qstart;qel('quizSubmit').onclick=()=>qgrade(qel('quizAnswer').value);qel('quizAnswer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();qgrade(qel('quizAnswer').value)}});qel('quizSkip').onclick=()=>qgrade('',true);qel('quizNext').onclick=qnext;qel('quizListen').onclick=()=>speak(quiz.questions[quiz.i]?.w.w);qel('quizAgain').onclick=()=>{qview('setup');qavailable()};qel('quizRetry').onclick=()=>{const wrong=quiz.results.filter(x=>!x.ok).map(x=>x.q.w);if(wrong.length)qbegin(qshuffle(wrong),qel('quizType').value)};
for(const k of ['ä','ö','ü','ß','Ä','Ö','Ü']){const b=document.createElement('button');b.type='button';b.textContent=k;b.onclick=()=>{const input=qel('quizAnswer');if(input.disabled)return;const a=input.selectionStart??input.value.length,z=input.selectionEnd??a;input.setRangeText(k,a,z,'end');input.focus()};qel('quizKeys').append(b)}

el('studyAuto').onclick=()=>setAuto('study');el('quizAuto').onclick=()=>setAuto('quiz');autoButtons();
applyFilters();studyReady=true;
}
</script>
